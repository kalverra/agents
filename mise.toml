[tasks.build]
description = "Build agents binary"
run = "go build -o agents ."

[tasks.test]
description = "Run unit tests with gotestsum"
run = "go tool gotestsum -- -cover ./..."

[tasks."test:integration"]
description = "Run LLM Wake-on-LAN and Ollama end-to-end integration test"
run = "go test -count=1 -v -tags=integration ./internal/llm -run TestRunner_Routing_WindowsOllama_E2E"

[tasks.lint]
description = "Run golangci-lint with automatic fixes"
run = "golangci-lint run ./... --fix"

[tasks.install]
description = "Build agents, deploy instructions/hooks/skills, and install to GOPATH"
run = ["go build -o agents .", "./agents install", "go install ."]

[tasks.lefthook]
description = "Verify lefthook dependencies and sync git hooks"
run = """
set -euo pipefail
missing=()
for cmd in lefthook betterleaks codespell actionlint golangci-lint go; do
  if ! command -v "$cmd" >/dev/null; then
    missing+=("$cmd")
  fi
done
if [ "${#missing[@]}" -gt 0 ]; then
  echo "Missing dependencies (install these, then re-run mise run lefthook):" >&2
  printf '  - %s\n' "${missing[@]}" >&2
  exit 1
fi
go mod download
lefthook install
"""

[tasks.eval]
description = "Run eval command"
run = "go run . eval \"$@\""
