# Implement configuration for `agents implement`.
# Place at <repo>/.agents/implement.yaml (takes precedence) or
# ~/.config/agents/implement.yaml ($XDG_CONFIG_HOME/agents/implement.yaml).
#
# The plan or spec is never written by the tool: it already exists (an
# openspec change, a spec-kit specs/ folder, or a plan.md passed with
# --plan). Each mode references agents defined in the top-level agents
# catalog by name. Optional worker_options / reviewer_options let the spec
# pick alternative agents for specific steps (a step declares them with
# **Worker**: / **Reviewer**: lines).
#
# verification declares the repo's test/lint/build commands the harness
# runs itself after each step, in the order written (first failure stops).
# A "## Verification" section in the imported spec overrides these.
#
# timeout (Go duration, e.g. 45m) bounds one headless run; maps to agy
# --print-timeout (default 30m). agy's own 5m default kills mid-loop runs.

agents:
  fast:
    harness: agy
    model: gemini-3.8-flash-medium
    description: cheap and fast; mechanical edits, renames, test scaffolding
  strong:
    harness: agy
    model: gemini-3.8-flash-high
    description: default; most implementation work
  opus:
    harness: claude
    model: opus
    effort: high
    description: strongest and priciest; subtle logic, tricky refactors
  opus-xhigh:
    harness: claude
    model: opus
    effort: xhigh
    description: strongest and priciest with extra thinking
  review-fast:
    harness: opencode
    model: fireworks-ai/accounts/fireworks/models/glm-5p3-flash
    effort: high
  review-deep:
    harness: opencode
    model: fireworks-ai/accounts/fireworks/models/glm-5p3
    effort: high

modes:
  standard:
    worker: fast
    worker_options: [fast, strong]
    reviewer: review-fast

  intense:
    worker: strong
    worker_options: [fast, strong, opus]
    reviewer: review-fast
    reviewer_options: [review-fast, review-deep]

  extreme:
    worker: strong
    worker_options: [strong, opus, opus-xhigh]
    reviewer: review-deep
    reviewer_options: [review-fast, review-deep]

# The repo's verification commands, run by the harness after each step so
# workers do not burn context re-running the full suite themselves.
# Declare the auto-fixing variant of any check that has one
# (golangci-lint run --fix, go mod tidy, ...) because the harness reviews
# and commits those fixes with the step. Commands must be non-interactive
# and exit non-zero on failure.
verification:
  build: go build ./...
  test: go test ./...
  lint: golangci-lint run ./... --fix

# Close the loop with the source spec when a session completes: archive
# an openspec change (openspec CLI), mark a spec-kit spec done. Default true.
archive_on_done: true

# Shell command run in the repo at session start and resume. Its stdout is
# inlined into every worker prompt (e.g. the current ticket). A failing
# command stops the session. Default: unset.
# context_command: agents ticket status --ai-output

# Refuse to start or resume a session on the repo's default branch.
# Default false.
# refuse_default_branch: true

# Max worker fix rounds after reviewer rejection before escalating to the user.
review_max_rounds: 3

# Max worker fix attempts after a verification command fails, before
# escalating to the user.
verify_max_rounds: 2
